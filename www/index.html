<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>شوارع الرمادي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;touch-action:none;color:#fff}
canvas{display:block}
#loading,#menu,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#loading{background:linear-gradient(#2b2118,#000)}
#loading h1,#menu h1{font-size:44px;margin:0 0 6px;color:#f3c14b;text-shadow:0 3px 0 #7a4b00,0 6px 18px #000}
.sub{opacity:.8;margin-bottom:22px}
.logo{width:110px;height:110px;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.6);margin-bottom:10px}
#barbox{width:60%;max-width:420px;height:12px;border-radius:6px;background:#333;overflow:hidden}#bar{height:100%;width:0;background:#f3c14b;transition:width .2s}
#menu{display:none;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.75))}
.big{font:bold 24px Tahoma;padding:14px 46px;border:0;border-radius:40px;background:#f3c14b;color:#3a2400;box-shadow:0 5px 0 #8a5c00;margin-top:10px}
.help{margin-top:18px;font-size:13px;opacity:.85;text-align:center;line-height:1.8}
#over{display:none;background:rgba(80,0,0,.55)}#overMsg{font-size:40px;font-weight:bold;margin-bottom:10px}
#hud{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#look{position:absolute;top:0;bottom:0;right:0;width:62%;pointer-events:auto}
#mission{transition:opacity .8s;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:7px 16px;border-radius:18px;font-size:15px;max-width:60%;text-align:center}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;text-shadow:0 2px 6px #000;transition:opacity .5s;opacity:0;text-align:center;width:80%}
#stats{position:absolute;top:10px;right:12px;width:170px}
#stars{font-size:22px;color:#ffd400;text-shadow:0 0 4px #000;letter-spacing:2px;text-align:left;direction:ltr}
.bar{height:9px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%}
#hpbar{background:#e33}#vhp{background:#3ad}
#carhud{display:none}#speed{font-size:22px;font-weight:bold;text-shadow:0 2px 4px #000;margin-top:4px}
#minimap{position:absolute;top:10px;left:12px;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.8);box-shadow:0 2px 8px #000}
#city{position:absolute;top:136px;left:12px;width:126px;text-align:center;font-size:13px;font-weight:bold;text-shadow:0 1px 3px #000}
#money{position:absolute;top:156px;left:8px;width:134px;text-align:center;font-weight:bold;font-size:15px;text-shadow:0 2px 4px #000;color:#9f9}
#timer{display:none;position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:4px 14px;border-radius:14px;font-weight:bold;direction:ltr}
#jobsBtn{top:182px;left:22px;width:auto;height:auto;padding:6px 12px;border-radius:16px;background:rgba(0,0,0,.5);font-size:13px}
#jobs{display:none;position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:auto}
#jobs .jt{font-size:24px;font-weight:bold;margin-bottom:6px}
#jobs button{font:bold 18px Tahoma;width:min(420px,80vw);padding:10px;border:0;border-radius:14px;background:#f3c14b;color:#3a2400;text-align:right;display:flex;flex-direction:column}
#jobs small{font-weight:normal;font-size:12px;opacity:.8}
#jobs .jrow{display:flex;gap:10px}#jobs .jrow button{width:auto;background:#ddd;font-size:14px;padding:8px 18px}
#fps{position:absolute;bottom:4px;left:50%;font-size:10px;opacity:.5}
#stick{position:absolute;left:28px;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold;pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.6);text-shadow:0 1px 3px #000}
#shootBtn{right:30px;bottom:40px;width:86px;height:86px;background:rgba(220,40,40,.55);font-size:17px}
#enterBtn{right:135px;bottom:120px;width:66px;height:66px;background:rgba(40,120,220,.5);font-size:15px}
#wpnBtn{right:40px;bottom:140px;width:62px;height:62px;background:rgba(60,60,60,.6);font-size:12px}
body.car #wpnBtn{display:none}
#enterBtn.glow{background:rgba(40,160,255,.9);box-shadow:0 0 18px #4af}
#gas{right:24px;bottom:22px;width:78px;height:130px;border-radius:14px;background:linear-gradient(#5c5f63,#2e3033);border:3px solid #9aa;font-size:14px;display:none;flex-direction:column;box-shadow:inset 0 -8px 0 rgba(0,0,0,.35)}
#gas::before,#brk::before{content:"";position:absolute;left:12px;right:12px;top:14px;bottom:30px;background:repeating-linear-gradient(#777 0 6px,#444 6px 12px);border-radius:6px;opacity:.8}
#gas span,#brk span{position:absolute;bottom:6px}
#brk{right:116px;bottom:22px;width:96px;height:90px;border-radius:14px;background:linear-gradient(#5c5f63,#2e3033);border:3px solid #9aa;font-size:14px;display:none;box-shadow:inset 0 -8px 0 rgba(0,0,0,.35)}
#gas.on,#brk.on{transform:scale(.93) translateY(4px);filter:brightness(1.3)}
#hand{right:224px;bottom:26px;width:56px;height:56px;background:rgba(120,120,120,.55);font-size:12px;display:none}
#wheel{position:absolute;left:24px;bottom:16px;width:170px;height:170px;display:none;pointer-events:auto;touch-action:none}
#wheel svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
body.car #stick{display:none}body.car #wheel{display:block}body.car #gas,body.car #brk,body.car #hand{display:flex}
body.car #shootBtn{right:30px;bottom:170px;width:70px;height:70px}
body.car #enterBtn{right:118px;bottom:126px;width:60px;height:60px}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,0,0,.8);opacity:0;z-index:4}
#busted{position:absolute;top:45%;width:100%;text-align:center;font-size:30px;font-weight:bold;color:#7cf;text-shadow:0 2px 8px #000;opacity:0}
</style>
</head>
<body>
<div id="loading"><img src="assets/icon.png" class="logo"><h1>شوارع الرمادي</h1><div class="sub" id="loadTxt">جاري التحميل...</div><div id="barbox"><div id="bar"></div></div></div>
<div id="menu"><img src="assets/icon.png" class="logo"><h1>شوارع الرمادي</h1><div class="sub">سوگ • اركب • اهرب من الشرطة</div>
<button class="big" id="startBtn">ابدأ اللعب</button>
<div class="help">ماشي: العصا للحركة • اسحب بالشاشة لتدوير الكاميرا<br>بالسيارة: المقود للتوجيه • دواسة البنزين والبريك • رمي من الشباك</div></div>
<div id="over"><div id="overMsg"></div><button class="big" id="retryBtn">حاول مرة ثانية</button></div>
<div id="hurt"></div>
<div id="hud">
  <div id="look"></div>
  <canvas id="minimap" width="240" height="240"></canvas>
  <div id="mission"></div>
  <div id="stats"><div id="stars">☆☆☆☆☆</div><div class="bar"><i id="hpbar"></i></div>
    <div id="carhud"><div class="bar"><i id="vhp"></i></div><div id="speed">0</div></div></div>
  <div id="toast"></div>
  <div id="money">💵 0 د.ع</div>
  <div id="timer"></div>
  <div class="btn" id="jobsBtn">📋 مهمات</div>
  <div id="jobs"><div class="jt">📋 المهمات</div>
    <button data-job="taxi">🚕 تكسي <small>وصّل راكب للمدينة الثانية — ٢٥ ألف+</small></button>
    <button data-job="chase">🚔 الحگ الحرامي <small>اصدم سيارته لحد ما توگف — ٥٠ ألف</small></button>
    <button data-job="gen">⚡ أبو المولدة <small>شرد بفلوس الأمبيرات — ٧٥ ألف</small></button>
    <div class="jrow"><button id="jobCancel">إلغاء المهمة</button><button id="jobsClose">إغلاق</button></div></div><div id="busted">الشرطة لزمتك! تحرك!</div>
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="shootBtn">رمي</div>
  <div class="btn" id="enterBtn">اركب</div>
  <div class="btn" id="wpnBtn">🔫 مسدس</div>
  <div class="btn" id="gas"><span>بنزين</span></div>
  <div class="btn" id="brk"><span>بريك</span></div>
  <div id="wheel"><svg viewBox="-100 -100 200 200"><circle r="88" fill="none" stroke="#222" stroke-width="20"/><circle r="88" fill="none" stroke="#3a3a3a" stroke-width="12"/><circle r="22" fill="#2a2a2a" stroke="#555" stroke-width="4"/><path d="M-80 8 L-20 4 L-20 -4 L-80 -8 Z M80 8 L20 4 L20 -4 L80 -8 Z M-6 20 L6 20 L8 80 L-8 80 Z" fill="#2d2d2d" stroke="#555" stroke-width="2"/><rect x="-5" y="-98" width="10" height="20" rx="3" fill="#e33"/><text y="7" text-anchor="middle" font-size="16" fill="#ccc" font-weight="bold">R</text></svg></div>
  <div class="btn" id="hand">هاند</div>
  <div id="fps"></div>
  <div id="city"></div>
</div>
<script src="game.js"></script>
</body>
</html>
